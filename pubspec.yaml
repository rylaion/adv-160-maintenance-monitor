name: adv_mon
description: ADV-MON - Honda ADV 160 Maintenance Monitor. Offline maintenance logbook.
publish_to: "none"
version: 0.3.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  drift: ^2.18.0
  sqlite3: ^2.4.5
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # State management / navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # UI / charts
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Notifications / background reminders
  flutter_local_notifications: ^17.2.1
  workmanager: ^0.5.2
  timezone: ^0.9.4

  # Media / files (photo attachments, backup restore)
  image_picker: ^1.1.2
  file_picker: ^8.0.7
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  http: ^1.6.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/parts_catalog/adv160_2023/diagrams/
    - assets/images/parts_catalog/adv160_2023/pages/
    - assets/data/
